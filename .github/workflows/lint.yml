name: lint

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6"

      - name: Ruff check
        run: ruff check manufacturing_pipeline/ tests/

      - name: Ruff format check
        run: ruff format --check manufacturing_pipeline/ tests/
