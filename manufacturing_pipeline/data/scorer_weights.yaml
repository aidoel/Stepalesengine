schema_version: 1
description: |
  Default scorer weights. See docs/adr/0002-score-based-classification.md and
  docs/adr/0008-scorer-cross-terms.md for the rationale behind each rule.

  Each rule is `(feature, transform, weight)`. `feature` is either a single
  feature name (string) or a list of names (cross-term). `transform` must be
  one of the named callables registered in scorers._TRANSFORMS - no string is
  ever eval'd. `weight` is a float multiplier on the transformed value.

classes:
  plaat:
    - feature: top1_face_pct
      transform: linear
      weight: 0.7
    - feature: [top1_face_pct, unfoldable]
      transform: top1_times_unfoldable
      weight: 0.8
    # An unfold is a sheet-metal signal only when it is NOT a seamed tube:
    # a hollow RHS/CHS section unfolds as a rolled-and-seamed wall, but it is
    # a constant-section profile, not bent sheet. The cross-term gates the
    # reward off the seamed_tube flag (see docs/adr/0008-scorer-cross-terms.md).
    - feature: [unfoldable, seamed_tube]
      transform: and_not
      weight: 1.2
    # A successful unfold with bends is the strongest sheet-metal signal:
    # it overrides the hole-density / pocket rewards that a bent part with
    # many holes would otherwise leak into 'anders'. Gated off seamed_tube
    # for the same reason as the unfoldable rule above.
    - feature: [has_bends, seamed_tube]
      transform: and_not
      weight: 1.2
    - feature: aspect_ratio
      transform: neg_clamp10
      weight: 0.3
    - feature: name_profile_hit
      transform: linear
      weight: -0.3

  profiel:
    - feature: cross_section_constant
      transform: bool
      weight: 1.5
    - feature: aspect_ratio
      transform: clamp10
      weight: 0.8
    - feature: name_profile_hit
      transform: linear
      weight: 0.3
    - feature: profile_match_designation
      transform: bool
      weight: 0.8
    # A hollow / seamed structural section (RHS, SHS, CHS, welded channel) is
    # a profile. The UnfoldProbe rolls its closed wall open and reports a
    # PARTIAL unfold with seamed_section set; this rewards profiel directly so
    # such tubes are not dragged into 'plaat' by the unfold signal.
    - feature: seamed_tube
      transform: bool
      weight: 1.5
    - feature: top1_face_pct
      transform: linear
      weight: -0.5
    # A genuine unfold counts against 'profiel' - but not when it is the
    # seamed-tube unfold of a hollow section, which IS a profile. The
    # cross-term suppresses the penalty for seamed tubes.
    - feature: [unfoldable, seamed_tube]
      transform: and_not
      weight: -0.8
    # A bent sheet part is not a (constant-section) profile. Kept mild so a
    # genuine angle/channel profile is still decided by cross_section_constant
    # and profile_match_designation; suppressed for seamed tubes for the same
    # reason as the unfoldable rule above.
    - feature: [has_bends, seamed_tube]
      transform: and_not
      weight: -0.3
    # Round bars, turned shafts and hollow tubes with varying outer diameter
    # all carry most of their surface area on cylindrical faces. The matcher
    # only fires on standard structural sections and the constancy check rejects
    # stepped diameters, so a high cylindrical_pct is the remaining signal that
    # an elongated cylindrical body is a profile, not a plate or freeform blob.
    - feature: cylindrical_pct
      transform: linear
      weight: 1.5

  anders:
    - feature: name_din_hit
      transform: linear
      weight: 0.5
    - feature: vendor_code_present
      transform: linear
      weight: 0.5
    - feature: bspline_pct
      transform: linear
      weight: 1.5
    - feature: hole_density
      transform: linear
      weight: 1.2
    - feature: hull_concavity
      transform: linear
      weight: 1.0
    - feature: [top1_face_pct, unfoldable]
      transform: top1_times_not_unfoldable
      weight: 1.5
    - feature: pocket_complexity
      transform: linear
      weight: 1.0
    - feature: unfoldable
      transform: bool
      weight: -0.3
    # Machined / freeform parts do not unfold with bends; a part that does is
    # sheet metal, so suppress the hole-density / pocket rewards above.
    - feature: has_bends
      transform: bool
      weight: -1.2
    # A cylindrical-dominated body (round bar, turned shaft, pipe with stepped
    # outer diameter) is a profile, not a machined freeform 'anders' part. The
    # hull_concavity / pocket_complexity rewards above would otherwise leak a
    # turned profile with a bored centre into 'anders'; this gates them off.
    - feature: cylindrical_pct
      transform: linear
      weight: -0.8
